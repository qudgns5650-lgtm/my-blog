<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <script>
    // 첫 렌더 전에 테마를 적용해 깜빡임을 막습니다.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드 전환" aria-pressed="false">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <h1>글 목록</h1>
      <p>생각하고 배운 것을 기록합니다.</p>
    </section>
    <ul class="post-list" id="post-list" aria-live="polite">
      <li class="status">글을 불러오는 중…</li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> My Blog</div>
  </footer>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
